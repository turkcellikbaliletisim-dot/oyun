<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kart Sayfası 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:794px;height:1123px;box-sizing:border-box;padding:0 40px;background:#ffffff;display:flex;flex-direction:column;font-family:'Source Sans 3',sans-serif">
<div style="height:62px;flex:none;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#6b6478"><span>Türkiye Serisi · Sayfa 2/5</span><span>Kartları kenarlarından kes (63×88 mm)</span></div>
<div style="display:grid;grid-template-columns:repeat(3,238px);grid-auto-rows:333px;gap:0">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="9">
<div style="width:238px;height:333px;box-sizing:border-box;padding:6px;background:{{c.rim}};border-radius:12px">
<div style="width:100%;height:100%;box-sizing:border-box;padding:7px;background:#f7f0e1;border:2px solid {{c.accent}};border-radius:8px;display:flex;flex-direction:column;gap:6px">
<div style="height:34px;display:flex;align-items:center;justify-content:space-between;gap:6px">
<div style="flex:1;font-family:'Alegreya',serif;font-weight:800;font-size:16px;line-height:1.05;color:#1d1a2f">{{c.name}}</div>
<div style="width:30px;height:30px;flex:none;box-sizing:border-box;border-radius:50%;border:2px solid {{c.rim}};background:{{c.accent}};color:#ffffff;font-family:'Alegreya',serif;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center">{{c.cost}}</div>
</div>
<div style="height:104px;flex:none;box-sizing:border-box;border-radius:6px;border:1px solid {{c.accent}};background:{{c.art}};display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:9px;letter-spacing:0.12em;font-weight:700;color:{{c.dark}}">ÇİZİM ALANI</div>
<div style="height:14px;flex:none;display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:0.08em;font-weight:700"><span style="color:{{c.dark}}">{{c.typeName}}</span><span style="color:{{c.ink}}">{{c.rarityLabel}}</span></div>
<div style="flex:1;min-height:0;box-sizing:border-box;padding:6px 8px;background:#fffaf0;border:1px solid #d9ccb0;border-radius:6px;display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:12px;line-height:1.3;color:#2a2638">
<sc-if value="{{c.hasKw}}" hint-placeholder-val="{{ true }}"><div style="font-weight:700;color:{{c.dark}}">{{c.kw}}</div></sc-if>
<sc-if value="{{c.hasText}}" hint-placeholder-val="{{ true }}"><div>{{c.text}}</div></sc-if>
</div>
<div style="height:32px;flex:none;display:flex;align-items:center;justify-content:space-between">
<div style="font-size:10px;color:#6b6478">Anadolu Diyarı · {{c.n}}/40</div>
<sc-if value="{{c.isWarrior}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;gap:5px">
<div style="height:26px;min-width:44px;padding:0 9px;box-sizing:border-box;border-radius:13px;background:#b5452f;color:#ffffff;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:15px"><span style="font-size:9px;font-weight:700;letter-spacing:0.06em">SAL</span>{{c.atk}}</div>
<div style="height:26px;min-width:44px;padding:0 9px;box-sizing:border-box;border-radius:13px;background:#2f7d5b;color:#ffffff;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:15px"><span style="font-size:9px;font-weight:700;letter-spacing:0.06em">CAN</span>{{c.hp}}</div>
</div>
</sc-if>
<sc-if value="{{c.isOther}}" hint-placeholder-val="{{ false }}"><div style="font-size:11px;font-weight:700;color:{{c.dark}}">{{c.foot}}</div></sc-if>
</div>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":794,"height":1123}}'>
class Component extends DCLogic {
renderVals() {
const T = {
S: { name: 'SAVAŞÇI', accent: '#b5452f', dark: '#8c2f1d', art: 'repeating-linear-gradient(45deg,#f1d6cc 0 9px,#ecc9bd 9px 18px)', foot: '' },
B: { name: 'BÜYÜ', accent: '#1d7f86', dark: '#14595f', art: 'repeating-linear-gradient(45deg,#d3eaeb 0 9px,#c0dfe1 9px 18px)', foot: 'Anlık etki' },
T: { name: 'TUZAK', accent: '#5a4a8a', dark: '#3f3268', art: 'repeating-linear-gradient(45deg,#e0daef 0 9px,#d1c9e5 9px 18px)', foot: 'Gizli oynanır' }
};
const R = {
Y: { label: 'YAYGIN', rim: '#a0795a', ink: '#6b4a32' },
N: { label: 'NADİR', rim: '#5d8fc2', ink: '#2c5f93' },
E: { label: 'EFSANEVİ', rim: '#d4a72c', ink: '#7a5c06' }
};
const rows = [
[10, "Kervansaray Tüccarı", 3, "S", 2, 3, "", "Oynanınca bu tur +1 enerji.", "Y"],
[11, "Çini Ustası", 3, "S", 2, 4, "", "Oynanınca bir dost savaşçıya +1/+1.", "N"],
[12, "Nasreddin Hoca", 3, "S", 2, 3, "", "Oynanınca rakibin en güçlü savaşçısı bu tur saldıramaz.", "N"],
[13, "Yeniçeri", 4, "S", 4, 4, "", "Etkisi yok.", "Y"],
[14, "Sipahi", 4, "S", 5, 3, "Hızlı", "", "Y"],
[15, "Kale Muhafızı", 4, "S", 2, 6, "Koruyucu", "", "Y"],
[16, "Şahmaran Yavrusu", 4, "S", 3, 3, "Zehirli", "", "N"],
[17, "Alp Eren", 5, "S", 5, 5, "", "Etkisi yok.", "Y"],
[18, "Tepegöz", 5, "S", 7, 3, "", "Oynanınca kendine 1 hasar.", "N"]
];
const cards = rows.map(([n, name, cost, t, atk, hp, kw, text, r]) => {
const ty = T[t], ra = R[r];
return { n, name, cost, accent: ty.accent, dark: ty.dark, art: ty.art, typeName: ty.name, rim: ra.rim, ink: ra.ink, rarityLabel: ra.label, kw, hasKw: !!kw, text, hasText: !!text, atk, hp, isWarrior: t === 'S', isOther: t !== 'S', foot: ty.foot };
});
return { cards };
}
}
</script>
</body>
</html>
