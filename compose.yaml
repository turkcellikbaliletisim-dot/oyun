services:
  server:
    build: .
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DESTAN_DATA_DIR: /app/.data
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r=await fetch('http://127.0.0.1:8080/api/health');const d=await r.json();if(!r.ok||!d.ready)process.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
