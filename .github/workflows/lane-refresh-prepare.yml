name: Prepare lane refresh
on:
  push:
    branches: ['gorsel-kalite/serit-yenileme-20261013']
    paths: ['.github/workflows/lane-refresh-prepare.yml', 'scripts/prepare_lane_refresh_final.py']
permissions:
  contents: write
concurrency:
  group: lane-refresh-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Pack refined sources and validate dimensions, alpha, and green fringe
        run: python scripts/prepare_lane_refresh_final.py
      - name: Preserve original package coverage and record the new scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          expected=json.loads(Path('dokumanlar/skin_v2_expected.json').read_text())
          for name,size in expected.items():
              with Image.open(Path('native/skin')/name) as im:
                  assert list(im.size)==size, name
                  im.verify()
          notes='''# Saha şeritleri ve yükleme ipucu paneli - 13 Ekim 2026
          Kaynak: claude/mobil-arayuz-skin-v2 / acf6f30562ebb24268ae703429ca5a1cfc5f3b15.

          ## Üretim ve kapsam
          Üç ayrı Adobe Firefly üretimi kullanıldı; eski atlas büyütülmedi. Adobe arka plan kaldırma ve yeşil renk aralığı düzeltmesinden sonra, yarı saydam sınırın iki çıktı pikseli yakınındaki kalıntıya hassas renk temizliği uygulandı. Alfa ve opak iç alan korunur. İlk iki aday renk kalıntısı testinden geçmedi; test eşiği gevşetilmedi.
          Uçlar orantılı kalan yatay üç-parça yerleşimiyle hedef boyuta uyarlandı. Yalnız sade orta alanın oranı ayrı değişir; her parça kaynak piksellerinden küçültülür. Bu teknik paketleme AI büyütme veya tüm görselin orantısız esnetilmesi değildir.
          lane.png ve lane_enemy.png: 1024x400. loading_tip_panel.png: 900x160. Dış alan gerçek alfa; merkez boyalı, koyu ve yazısızdır.
          Tam kaynaklar serit-yenileme-kaynak/ içinde. Hash, kaynak boyutu, kesit ve işlem kayıtları serit-yenileme-kontrol.json ve native/skin/manifest_lane_refresh.json içindedir.
          İki eski manifestte yalnız ilgili şerit kaydı yenilendi; eski kayıt previous_revision içinde saklanır. Orijinal 114 dosyalık paket sayımı değişmedi; ipucu paneli ek dosyadır.

          ## Oyun bağlantısı
          mobile.gd ve landscape_match.gd içinde yalnız şerit çizimindeki yatay kesit payı 246 px olarak güncellendi. Dosya adları, oyun kuralları, ağ/hesap işleyişi, diğer PNG'ler, fontlar ve sesler değişmedi.
          loading_tip_panel.png dosya olarak eklendi; giriş/yükleme ekranı akışı bu değişiklikte kurulmadı.

          ## Doğrulama sınırı
          Üç PNG'nin boyutları, alfa kenarları, opak merkezleri, yeşil renk kalıntısı ve yeniden açılması; eski 114 PNG'nin kapsamı/boyutları kontrol edildi. Gerçek renderer ekranları ve oyun kontrolleri PR üzerinden ayrıca doğrulanacak. Fiziksel cihaz testi yapılmadı.
          Üç yeni kahraman, üç rütbe rozeti, gerçek ses ve mevcut zamanlama/kart metni işleri bu kapsamda değildir.
          '''
          Path('dokumanlar/SERIT-YENILEME-20261013.md').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in notes.splitlines())+'\n')
          PY
      - name: Commit only the allowlisted outputs to this art branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'gorsel-kalite/serit-yenileme-20261013'
          git add -- native/skin/lane.png native/skin/lane_enemy.png native/skin/loading_tip_panel.png native/skin/manifest.json native/skin/manifest_v2.json native/skin/manifest_lane_refresh.json native/mobile.gd native/landscape_match.gd dokumanlar/serit-yenileme-kaynak dokumanlar/serit-yenileme-kontrol.json dokumanlar/SERIT-YENILEME-20261013.md
          python - <<'PY'
          import subprocess
          allowed={'native/skin/lane.png','native/skin/lane_enemy.png','native/skin/loading_tip_panel.png','native/skin/manifest.json','native/skin/manifest_v2.json','native/skin/manifest_lane_refresh.json','native/mobile.gd','native/landscape_match.gd','dokumanlar/serit-yenileme-kaynak/lane.png','dokumanlar/serit-yenileme-kaynak/lane_enemy.png','dokumanlar/serit-yenileme-kaynak/loading_tip_panel.png','dokumanlar/serit-yenileme-kontrol.json','dokumanlar/SERIT-YENILEME-20261013.md'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==allowed, actual^allowed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh transparent battlefield lanes and add loading tip panel'
          git push origin HEAD:gorsel-kalite/serit-yenileme-20261013
      - name: Save image candidates and technical metadata for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-refresh-assets
          retention-days: 7
          if-no-files-found: error
          path: |
            native/skin/lane.png
            native/skin/lane_enemy.png
            native/skin/loading_tip_panel.png
            native/skin/manifest_lane_refresh.json
            dokumanlar/serit-yenileme-kaynak/*.png
            dokumanlar/serit-yenileme-kontrol.json
            dokumanlar/SERIT-YENILEME-20261013.md
