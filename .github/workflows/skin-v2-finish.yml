name: Finish second skin package
on:
  push:
    branches: [yeni-gorsel-2-20261012]
    paths: [.github/workflows/skin-v2-finish.yml]
permissions:
  contents: write
concurrency:
  group: skin-v2-finish
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import checksum-verified packaging script
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 1 --connect-timeout 15 --max-time 90 'https://at.adobe.com/fNhRdIZppFSf4G9P' -o "$RUNNER_TEMP/finish.zip"
          echo "7bff4bbda115ada3a0f557de93d48b34c408b1b7d86789dc9aade6540de229da  $RUNNER_TEMP/finish.zip" | sha256sum -c -
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'finish.zip') as z:
              assert z.namelist()==['scripts/skin_v2_finish.py']
              text=z.read('scripts/skin_v2_finish.py').decode()
          text=text.replace('import hashlib, io, json, math, tempfile','import hashlib, io, json, math, tempfile, subprocess')
          old="sf.write(path,x,SR,format='OGG',subtype='VORBIS');data,sr=sf.read(path,always_2d=True)"
          new="""channels=1 if x.ndim==1 else x.shape[1]
                  print('ENCODE',name,flush=True)
                  subprocess.run(['ffmpeg','-v','error','-y','-f','f32le','-ar',str(SR),'-ac',str(channels),'-i','pipe:0','-c:a','libvorbis','-q:a','5',str(path)],input=np.asarray(x,dtype='<f4').tobytes(),check=True,timeout=120)
                  decoded=subprocess.run(['ffmpeg','-v','error','-i',str(path),'-f','f32le','-acodec','pcm_f32le','-ar',str(SR),'-ac',str(channels),'pipe:1'],capture_output=True,check=True,timeout=120)
                  data=np.frombuffer(decoded.stdout,dtype='<f4').reshape(-1,channels);sr=SR"""
          new=new.replace('\n                  ','\n        ')
          assert old in text
          text=text.replace(old,new)
          text=text.replace('assert sr==SR and len(data)==len(x) and np.isfinite(data).all()', 'assert sr==SR and abs(len(data)-len(x))<=round(SR*.02) and np.isfinite(data).all()')
          Path('scripts/skin_v2_finish.py').write_text(text)
          compile(text,'scripts/skin_v2_finish.py','exec')
          PY
      - name: Install packaging dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install --disable-pip-version-check pillow numpy scipy fonttools cairosvg soundfile
      - name: Complete assets and run technical validation
        run: python -X faulthandler scripts/skin_v2_finish.py
      - name: Check file coverage and no distributed fonts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('native/skin/manifest_v2.json').read_text())
          assert m['png_count']==114 and not m['missing_png'] and not m['errors']
          assert m['audio_files_generated']==14
          assert len(list(Path('native/skin/audio').glob('*.ogg')))==14
          assert not list(Path('native/skin').rglob('*.ttf'))
          assert not list(Path('native/skin').rglob('*.otf'))
          print('114 PNG files and 14 OGG files validated. No font binaries distributed.')
          PY
      - name: Commit on isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'yeni-gorsel-2-20261012'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/skin_v2_finish.py native/skin dokumanlar/YENI-GORSEL-2.md dokumanlar/yeni-gorsel-2
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'Yeni gorsel 2: finish 114 PNGs, 14 provisional OGGs, font installer and QA'
            git push origin HEAD:yeni-gorsel-2-20261012
          fi
      - name: Export review artifacts without fonts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: destan-skin-v2-review
          retention-days: 7
          path: |
            native/skin/*.png
            native/skin/*.json
            native/skin/audio/*.ogg
            native/skin/audio/*.json
            native/skin/audio/*.md
            dokumanlar/YENI-GORSEL-2.md
            dokumanlar/yeni-gorsel-2/
            scripts/skin_v2_finish.py
            scripts/skin_v2_fonts.py
            scripts/skin_v2_fonts.command
