name: Yeni gorsel 2 source check
on:
  push:
    branches: [yeni-gorsel-2-20261012]
    paths: [.github/workflows/yeni-gorsel-2-source-check.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Fetch first independently generated illustration
        run: |
          set -euo pipefail
          mkdir -p dokumanlar/yeni-gorsel-2-kaynak
          curl --fail --location --retry 1 --connect-timeout 15 --max-time 60 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:32960499-80ab-4c47-8bc5-62139cd093c1' -o dokumanlar/yeni-gorsel-2-kaynak/scene_play.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p = Path('dokumanlar/yeni-gorsel-2-kaynak/scene_play.png')
          b = p.read_bytes()
          assert b[:8] == b'\x89PNG\r\n\x1a\n', 'Not a PNG'
          print('PNG dimensions:', struct.unpack('>II', b[16:24]), 'bytes:', len(b))
          PY
      - name: Save verified source on isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dokumanlar/yeni-gorsel-2-kaynak/scene_play.png
          git commit -m 'Add independently generated lobby scene source'
          git push origin HEAD:yeni-gorsel-2-20261012
