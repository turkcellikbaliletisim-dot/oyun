# Fly.io dağıtımı: `fly launch --no-deploy` sonrası `fly volumes create destan_data --size 1` ve `fly deploy`.
app = "destan-diyarlari"
primary_region = "otp"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  NODE_ENV = "production"
  DESTAN_DATA_DIR = "/data"
  # APP_ORIGIN = "https://destan-diyarlari.fly.dev"

[mounts]
  source = "destan_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
